title: Privilege escalation via runas (command) - runas command
id: 1a02d950-3cda-47e6-ad4c-7afbbdd3ab9c
name: win_os_runas_privilege_escalation_runas_command
description: Detects scenarios where attack attempts to elevate privileges via the command runas.
correlation_note: correlation between the 3 event IDs can be done over SubjectLogonId in order to get more context.
references:
- https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/TA0004-Privilege%20Escalation/T1134-Access%20Token%20Manipulation
- https://www.elastic.co/fr/blog/how-attackers-abuse-access-token-manipulation
- http://www.pseale.com/pretend-youre-on-the-domain-with-runas-netonly
- https://blog.palantir.com/windows-privilege-abuse-auditing-detection-and-defense-3078a403d74e
tags:
- attack.privilege-escalation
- attack.t1134.002
author: mdecrevoisier
status: experimental
logsource:
  category: process_creation
  product: windows
detection: # Full command: 'runas /user:<domain>\<user> cmd.exe'
  selection_command:
    Image|endswith: '\runas.exe'
    CommandLine|contains|all:
      - runas
      - '/user:'
  condition: selection_command
falsepositives:
- Administrator activity
level: medium

