title: Obfuscated payload transfered via service name - Tchopper (command) - count
id: e4875675-cbf6-4b42-878f-ad3b945d6270
status: experimental
author: mdecrevoisier
correlation:
  type: event_count
  rules:
    - win_os_payload_obfuscated_transfer_via_service_name_tchopper_command
  group-by:
    - Computer
  timespan: 20m
  condition:
    gt: 50
level: high
