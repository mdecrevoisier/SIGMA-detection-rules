logsource:
  product: windows
  category: registry_event
detection:
  selection:
    NewProcessName|endswith: '\netsh.exe' # Full path "C:\Windows\system32\netsh.exe"
    TargetObject|endswith: '\SOFTWARE\Microsoft\NetSh'
  condition: selection
