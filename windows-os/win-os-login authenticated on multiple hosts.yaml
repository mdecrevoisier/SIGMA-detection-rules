title: Network login performed to multiple targets
id: cce08b6d-5228-4d80-a708-f3d18f1f66bb
name: win_os_login_authenticated_on_multiple_hosts
description: Detects scenarios where an attacker would attempt to enumerate hosts resources and execute a payload with a compromised account. Vulnerability scanners, enumeration software or tool like SharepHound/CrackMapexec may generate such behavior.
references:
- https://medium.com/@Shorty420/enumerating-ad-98e0821c4c78
- https://book.hacktricks.xyz/pentesting/pentesting-smb
- https://0xdf.gitlab.io/2018/12/02/pwk-notes-smb-enumeration-checklist-update1.html
tags:
- attack.discovery
- attack.t1046 # network service scanning
- attack.initial-access
- attack.t1078 # valid accounts
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    TargetUserSid|startswith: S-1-5-21-
    LogonType: 3
  filter:
    IpAddress:
      - '%vulnerability_scanners%'
      - '%admin_jump_hosts%'
      - '127.0.0.1'
      - '::1'
  condition: selection and not filter # Count of many computer are reporting connection attemps from a single source IP
falsepositives:
- VAS scanners, administrator jump host, backup solutions, monitoring solutions
level: high

---
title: Network login performed to multiple targets - count
id: bb7378e7-057e-4bd2-ac13-9b61aaf372a8
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - win_os_login_authenticated_on_multiple_hosts
  group-by:
    - IpAddress
  timespan: 15m
  condition:
    gt: 20
    field: Computer
level: high
