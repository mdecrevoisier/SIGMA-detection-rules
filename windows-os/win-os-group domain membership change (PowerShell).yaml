title: Domain group membership change - ps_module
id: 1bd5e226-5b75-422f-8e65-58534e48740b
description: Detects if a member is added to a domain group via PowerShell.
tags:
- attack.persistence
- attack.t1098 # account manipulation
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  category: ps_module
detection: # Add-LocalGroupMember -Group "Administrators" -Member "Admin02",
  selection2_powershell_modern:
    EventID: 4103
    Payload|contains|all:
      - 'Add-ADGroupMember'
      - '-Identity'
      - '-Members'
  
  condition: 1 of selection*
falsepositives:
- Pentest
- Administrator activity
- Splunk UF agent installation
level: high

