title: Massive processes termination burst - count
id: be67b5de-fea8-45e4-880b-4c98ba2c6c61
status: experimental
author: mdecrevoisier
correlation:
  type: event_count
  rules:
    - win_os_process_termination_kill_burst
  group-by:
