title: Microsoft Defender signatures not up to date
id: 45608097-66f3-4824-8750-df94f58e2b4b
description: Detects scenarios where Defender signatures are outdated.
references:
- https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/Antivirus
- https://docs.microsoft.com/en-us/windows/security/threat-protection/microsoft-defender-antivirus/troubleshoot-microsoft-defender-antivirus
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  service: windefend
detection:
  selection_event:
    EventID: 1151
  selection_age: # Signature age in days, older than 7 days
    - Last AS signature age|gt: 7
    - Last AV signature age|gt: 7
    - Last AS security intelligence age|gt: 7
    - Last AV security intelligence age|gt: 7
  condition: selection_event and selection_age
falsepositives:
- Unconnected systems to internet
- Missconfigured systems unable to reach their signature update server (SCCM/SCEP/WSUS)
- System offline during long duration
- Windows system with license hack (date set to +10 years)
level: medium