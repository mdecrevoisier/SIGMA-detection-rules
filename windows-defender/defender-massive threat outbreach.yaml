title: Microsoft Defender massive virus outbreach
id: ea39a33b-72c3-4ce3-a541-2e66c1fe069f
name: defender_massive_threat_outbreach
description: Detects scenarios where a same threat is detected on different hosts in a short period of time
references:
- https://docs.microsoft.com/en-us/windows/security/threat-protection/microsoft-defender-antivirus/troubleshoot-microsoft-defender-antivirus
- https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/Antivirus
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 1116 # Threat detected, no action taken
  condition: selection
falsepositives:
- EICAR test file
level: high

---
title: Microsoft Defender massive virus outbreach - count
id: 226275be-463b-40ad-86d6-22032dda3d99
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - defender_massive_threat_outbreach
  group-by:
    - ThreatName
  timespan: 30m
  condition:
    gt: 10
    field: Computer
level: high
