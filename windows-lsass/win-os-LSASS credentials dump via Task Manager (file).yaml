status: experimental
logsource:
  product: windows
  category: file_creation # 11
detection:
  selection:
    Image|endswith: '\taskmgr.exe'
    TargetFilename|endswith: '.DMP' # example: C:\Users\Mike\AppData\Local\Temp\lsass (3).DMP
  condition: selection
