title: Windows Subsystem for Linux (WSL) installation (PowerShell)
id: 3c27ef03-ec12-4ea3-871a-dff830def5b3
related:
  - id: 55c925c1-7195-426b-a136-a9396800e29b
    type: similar
  - id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
