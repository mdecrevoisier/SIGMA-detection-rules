title: Domain group enumeration
id: 249a1ad8-40d5-465c-a045-3d57f5c3f1ed
name: win_ad_group_domain_enumeration_cme
description: Detects scenarios where an attacker enumerates domain group with tools like CME (--groups).
correlation_note: correlate TargetLogonId from ID 4624 with SubjectLogonId from ID 4661 to identify the source of the enumeration.
requirements: extended rights auditing enabled (https://www.manageengine.com/products/active-directory-audit/active-directory-auditing-configuration-guide-configure-object-level-auditing-manually.html)
references:
- https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/TA0007-Discovery/T1069-Permission%20Groups%20Discovery
- https://hideandsec.sh/books/cheatsheets/page/crackmapexec
- https://www.infosecmatter.com/crackmapexec-module-library/
- https://docs.microsoft.com/en-us/windows/win32/adschema/extended-rights
tags:
- attack.discovery
- attack.t1069.002
- attack.t1087.002
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    ObjectType|contains: '{bf967a9c-0de6-11d0-a285-00aa003049e2}' # Groups class
    ObjectServer: DS
    OperationType: Object Access
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter # Count how many different ObjectName (GUID of the group) were enumerated.
falsepositives:
- Administrator activity
level: high

---
title: Domain group enumeration - count
id: 6ba513a4-6986-4955-b820-ecd5ce6df2a8
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - win_ad_group_domain_enumeration_cme
  group-by:
    - Computer
  timespan: 15m
  condition:
    gt: 30
    field: ObjectName
level: high
