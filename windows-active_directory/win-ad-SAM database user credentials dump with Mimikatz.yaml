title: SAM database user credentials dump with Mimikatz
id: 2e9a076e-4592-45c4-aac9-2d8311968348
name: win_ad_sam_database_user_credentials_dump_with_mimikatz
description: Detects scenarios where an attacker dump the LSASS memory content using Mimikatz (sekurlsa module).
correlation_note: correlate TargetLogonId from ID 4624 with SubjectLogonId from ID 4661 to identify the source of the enumeration.
requirements: extended rights auditing enabled (https://www.manageengine.com/products/active-directory-audit/active-directory-auditing-configuration-guide-configure-object-level-auditing-manually.html)
references:
- https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/TA0006-Credential%20Access/T1003-Credential%20dumping
- https://ivanitlearning.wordpress.com/2019/09/07/mimikatz-and-password-dumps/
tags:
- attack.credential-access
- attack.t1003.001
author: mdecrevoisier
status: experimental
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4661
    ProcessName|endswith: '\lsass.exe'
    ObjectServer: Security Account Manager
    ObjectType: SAM_USER
    ObjectName|startswith: 'S-1-5-21-' # User SID dumped
    AccessList|contains|all:
      - '%%5446' # ChangePassword
      - '%%5447' # SetPassword
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter
falsepositives:
- None
level: high

---
title: SAM database user credentials dump with Mimikatz - count
id: 98f85e01-4b6e-478a-9827-7511f56beed8
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - win_ad_sam_database_user_credentials_dump_with_mimikatz
  group-by:
    - Computer
  timespan: 1h # v1 rule had no timeframe: 1h assumed, please adjust
  condition:
    gt: 10
    field: ObjectName
level: high
