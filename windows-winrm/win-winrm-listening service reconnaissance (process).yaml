title: WinRM listening service reconnaissance (process) - count
id: 0cc5a0fe-8435-4358-b70e-c22168279035
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - win_winrm_listening_service_reconnaissance_process
