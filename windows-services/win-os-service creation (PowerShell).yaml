logsource:
  product: windows
  category: ps_module
detection:
  selection2_powershell_modern:
    EventID: 4103
    Payload|contains|all:
      - New-Service
      - Name

  condition: 1 of selection*
falsepositives:
- administrator deplying service
- new application installation
level: high

