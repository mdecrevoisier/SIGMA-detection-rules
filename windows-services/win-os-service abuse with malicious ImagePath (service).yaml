title: Service abuse with malicious ImagePath (service)
id: ba5273d4-33c5-4e46-96ce-6321dd3fc77c
related:
  - id: 138d3531-8793-4f50-a2cd-f291b2863d78
    type: similar
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
